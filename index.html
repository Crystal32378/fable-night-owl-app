<style>
  :root{
    --bg:#070a12; --card:#0e1320; --line:#1c2437; --text:#e8e4d8; --dim:#8a93a8;
    --gold:#ffd27a; --amber:#f6b331; --cyan:#5ee0ff;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a; --info:#5ea8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px 6px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.5px}
  header h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .spacer{flex:1}
  @media (max-width:1750px){header h1 small{display:none}}
  @media (max-width:1400px){#badge{min-width:0}header button,header select{padding:6px 8px;font-size:12px}}
  #badge{font-size:13px;font-weight:700;letter-spacing:1px;padding:5px 12px;border-radius:999px;
    background:#1a2a1e;color:var(--ok);border:1px solid currentColor;min-width:150px;text-align:center;transition:all .25s}
  #badge.WRONG_DIRECTION{background:#2a2110;color:var(--warn)}
  #badge.OFF_ROUTE{background:#2b1414;color:var(--bad)}
  #badge.RECOVERED{background:#132038;color:var(--info)}
  #badge.ARRIVED{background:#2b2410;color:var(--gold)}
  button,select{font:inherit;font-size:13px;color:var(--text);background:#151c2c;border:1px solid #2a3450;
    border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .15s}
  button:hover{background:#1d2740}
  button.on{background:#2b2410;border-color:var(--gold);color:var(--gold)}
  #banner{margin:2px 18px 8px;padding:12px 22px;border-radius:14px;background:linear-gradient(180deg,#121a2c,#0d1320);
    border:1px solid #223050;min-height:92px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 0 40px rgba(94,224,255,.06) inset}

  #banner.correct{animation:flash .45s ease-in-out infinite alternate;border-color:var(--warn)}
  #banner.correct .zh{color:#ffc36b}
  #banner.arrived{border-color:var(--gold);box-shadow:0 0 60px rgba(255,210,122,.25) inset}
  @keyframes flash{from{background:#2a1c0c}to{background:#141a2c}}
  main{display:flex;gap:14px;padding:0 18px 10px;flex:1;min-height:0}
  #stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;perspective:1500px;perspective-origin:50% 30%}
  body.tilt canvas#map{transform:rotateX(30deg) translateY(-4%) scale(1.06);transform-origin:50% 60%;box-shadow:0 0 0 1px #1a2338,0 60px 80px rgba(0,0,0,.75)}
  canvas#map{transition:transform .6s ease}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);border-radius:14px}
  #stage{position:relative}
  header h1 span{text-shadow:0 0 14px rgba(255,210,122,.6),0 0 30px rgba(255,80,200,.25)}
  canvas#map{width:100%;max-height:100%;aspect-ratio:960/600;border-radius:14px;
    box-shadow:0 0 0 1px #1a2338,0 30px 60px rgba(0,0,0,.6);background:#0b0f1a;cursor:crosshair;touch-action:none;object-fit:contain}
  aside#panel{width:352px;flex:none;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0}
  .card.grow{flex:1 1 auto;min-height:90px;display:flex;flex-direction:column}
  .card.fixed{flex:none}
  .card.grow ul#log{flex:1;min-height:0;max-height:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .card h3{margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:.5px}
  .card h3 span{color:var(--dim);font-weight:400;font-size:11px;margin-left:6px}
  .style{margin-bottom:6px}
  .style .row{display:flex;justify-content:space-between;font-size:12.5px;align-items:baseline}
  .style .row b{font-size:13px}
  .style .row .tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
  .tag.pref{background:#12301f;color:var(--ok)}
  .tag.avoid{background:#3a1414;color:var(--bad)}

  .bar{height:8px;background:#161d2e;border-radius:4px;margin-top:4px;overflow:hidden;position:relative}

  .style .ev{font-size:11px;color:var(--dim);margin-top:3px;min-height:12px}

    <section class="card fixed"><h3>飛寶的使用者模型 <span id="personaTag">how you understand directions</span></h3><div id="styles"></div></section>

  <span>按住滑鼠或觸控，往想去的方向走</span>
  <span>目的地：華南銀行國際會議中心（松仁路123號）— 只有走到入口門前 20px 內才算抵達</span>

<script>
'use strict';
/* =====================================================================
   Fable Night Owl 飛寶
   Two strictly separated planes:
     · NavEngine  — navigation truth: street graph, shortest path, monotonic
                    waypoint commitment, per-frame state classification, replan.
     · Guidance   — phrases the engine's next step (cardinal/relative/landmark).
                    Never computes routes.
   Plus: UserModel (per-style trials, 3-strike AVOIDED, sticky preference,
   every-5th curiosity), Renderer, Audio/Voice, Game controller.
   ===================================================================== */

const W=960, H=600, ARRIVE_R=20, DRIFT_REPLAN=250;
const canvas=document.getElementById('map');
const ctx=canvas.getContext('2d');
const DPR=Math.min(2, window.devicePixelRatio||1);
canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);

/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hyp=Math.hypot;
function norm(x,y){const l=hyp(x,y)||1;return [x/l,y/l];}
function projSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy||1;
  let t=((px-ax)*dx+(py-ay)*dy)/l2; t=clamp(t,0,1);
  const x=ax+dx*t, y=ay+dy*t; return {t,x,y,d:hyp(px-x,py-y)};
}
// signed angle from a to b in degrees; positive = clockwise on screen = to the RIGHT (y-down)
function signedAngle(ax,ay,bx,by){return Math.atan2(ax*by-ay*bx, ax*bx+ay*by)*180/Math.PI;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const fmtT=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');};

/* ---------- MAP DATA (stylized Taipei Xinyi block) ---------- */
const STREETS=[
  {id:'xinyi',   name:'信義路五段', en:'Xinyi Rd. Sec. 5', axis:'h', pos:500, from:0,   to:W,   hw:18},
  {id:'songshou',name:'松壽路',     en:'Songshou Rd.',     axis:'h', pos:300, from:0,   to:W,   hw:13},
  {id:'songgao', name:'松高路',     en:'Songgao Rd.',      axis:'h', pos:110, from:0,   to:W,   hw:13},
  {id:'songzhi', name:'松智路',     en:'Songzhi Rd.',      axis:'v', pos:140, from:0,   to:H,   hw:13},
  {id:'songren', name:'松仁路',     en:'Songren Rd.',      axis:'v', pos:380, from:0,   to:H,   hw:14},
  {id:'songyong',name:'松勇路',     en:'Songyong Rd.',     axis:'v', pos:680, from:0,   to:500, hw:13},
];
const MRT_Y=566;
const EXITS=[{n:1,x:330},{n:2,x:560},{n:3,x:760}];         // nodes on Xinyi Rd (y=500)
const DOOR={x:406,y:400};                                    // the ONE true entrance (Songren Rd side of HNBK)
const APPROACH={x:380,y:400};                                // point on Songren Rd in front of the door
const HNBK={x:400,y:330,w:160,h:140};
const SOLID=[HNBK,{x:180,y:330,w:160,h:140}];
const NANSHAN={x:180,y:330,w:160,h:140};
const EXTRA=[...EXITS.map(e=>({street:'xinyi',t:e.x})),{street:'songren',t:APPROACH.y}];

// landmarks: glowing icons; guide:true → usable in landmark-style instructions
const LANDMARKS=[
  {id:'exit1', name:'捷運象山站 出口1', en:'MRT Xiangshan Exit 1', x:330,y:518, type:'exit', n:1, guide:true, cands:['b','l','r']},
  {id:'exit2', name:'捷運象山站 出口2', en:'MRT Xiangshan Exit 2', x:560,y:518, type:'exit', n:2, guide:true, cands:['b','r','l']},
  {id:'exit3', name:'捷運象山站 出口3', en:'MRT Xiangshan Exit 3', x:760,y:518, type:'exit', n:3, guide:true, cands:['b','r','l']},
  {id:'nanshan', name:'台北南山廣場', en:'Taipei Nan Shan Plaza', x:260,y:400, type:'nanshan', guide:true, cands:['in']},
  {id:'seven', name:'7-Eleven', en:'7-Eleven', x:648,y:462, type:'seven', guide:true, cands:['a','l','b']},
  {id:'family', name:'全家', en:'FamilyMart', x:350,y:200, type:'family', guide:true, cands:['l','a','b']},
  {id:'starbucks', name:'星巴克', en:'Starbucks', x:600,y:266, type:'starbucks', guide:true, cands:['a','r','l']},
  {id:'youbike', name:'微笑單車 YouBike', en:'YouBike station', x:712,y:332, type:'youbike', guide:true, cands:['r','b','a']},
  {id:'zebra', name:'斑馬線', en:'Crosswalk', x:380,y:470, type:'zebra', guide:true, cands:['l','r']},
  {id:'musha', name:'慕夏四季大廈', en:'Mucha Four Seasons Bldg.', x:470,y:190, type:'musha', guide:true, cands:['r','a','b']},
  {id:'lobby', name:'大廳金燈', en:'Lobby light', x:486,y:404, type:'lobby', guide:true, cands:['b','r']},
  {id:'door', name:'入口', en:'Entrance', x:DOOR.x,y:DOOR.y, type:'door', guide:false, cands:['a','b']},
  {id:'hnbk', name:'華南銀行國際會議中心', en:'HNBK · 松仁路123號', x:480,y:346, type:'hnbklabel', guide:false, cands:['c']},
];
const LM=Object.fromEntries(LANDMARKS.map(l=>[l.id,l]));

/* =====================================================================
   NAVIGATION-TRUTH ENGINE
   ===================================================================== */
class NavEngine{
  constructor(){
    this.nodes=[]; this.edges=[]; this._key=new Map();
    this.build();
    this.door=this.node(DOOR.x,DOOR.y);
    this.precompute();
    this.route=null; this.state='ON_ROUTE'; this.raw='ON_ROUTE';
    this.wrongTime=0; this.recoverT=-99; this.dirTo=[1,0]; this.dRoute=0; this.dGraph=0;
  }
  node(x,y){
    const k=x+','+y; if(this._key.has(k)) return this._key.get(k);
    const n={id:this.nodes.length,x,y,adj:[]}; this.nodes.push(n); this._key.set(k,n); return n;
  }
  edge(a,b,street){
    const e={a,b,len:hyp(a.x-b.x,a.y-b.y),street}; this.edges.push(e); a.adj.push({n:b,e}); b.adj.push({n:a,e});
  }
  build(){
    for(const s of STREETS){
      const ts=new Set([s.from,s.to]);
      for(const o of STREETS){
        if(o.axis===s.axis) continue;
        if(o.pos<s.from||o.pos>s.to) continue;
        if(s.pos<o.from||s.pos>o.to) continue;
        ts.add(o.pos);
      }
      for(const x of EXTRA) if(x.street===s.id) ts.add(x.t);
      const arr=[...ts].sort((a,b)=>a-b);
      for(let i=0;i<arr.length-1;i++){
        const p=t=>s.axis==='h'?[t,s.pos]:[s.pos,t];
        const [ax,ay]=p(arr[i]), [bx,by]=p(arr[i+1]);
        this.edge(this.node(ax,ay), this.node(bx,by), s);
      }
    }
    this.edge(this.node(APPROACH.x,APPROACH.y), this.node(DOOR.x,DOOR.y), null); // entrance stub
  }
  precompute(){ // Dijkstra from the door (single fixed goal)
    const N=this.nodes.length; this.dg=new Array(N).fill(Infinity); this.nxt=new Array(N).fill(null);
    this.dg[this.door.id]=0; const done=new Array(N).fill(false);
    for(let k=0;k<N;k++){
      let u=-1; for(let i=0;i<N;i++) if(!done[i]&&(u<0||this.dg[i]<this.dg[u])) u=i;
      if(u<0||this.dg[u]===Infinity) break; done[u]=true;
      for(const {n,e} of this.nodes[u].adj){
        const nd=this.dg[u]+e.len; if(nd<this.dg[n.id]){this.dg[n.id]=nd; this.nxt[n.id]=this.nodes[u];}
      }
    }
  }
  nearestEdge(x,y){
    let best=null;
    for(const e of this.edges){
      const p=projSeg(x,y,e.a.x,e.a.y,e.b.x,e.b.y);
      if(!best||p.d<best.d) best={edge:e,...p};
    }
    return best;
  }
  streetHalfWidthAt(ne){ return ne.edge.street? ne.edge.street.hw : 12; }
  onStreet(x,y,margin=3){ for(const e of this.edges){ const hw=(e.street?e.street.hw:12)-margin; const p=projSeg(x,y,e.a.x,e.a.y,e.b.x,e.b.y); if(p.d<=hw) return true; } return false; }
  planFrom(p){
    const ne=this.nearestEdge(p.x,p.y); const {a,b}=ne.edge;
    const ca=hyp(p.x-a.x,p.y-a.y)+this.dg[a.id], cb=hyp(p.x-b.x,p.y-b.y)+this.dg[b.id];
    let n=ca<=cb?a:b; const raw=[];
    while(n){ raw.push({x:n.x,y:n.y}); if(n===this.door) break; n=this.nxt[n.id]; }
    // collapse collinear waypoints so each waypoint is a real decision point
    const wps=[]; for(let i=0;i<raw.length;i++){
      if(i>0&&i<raw.length-1){
        const p0=raw[i-1],p1=raw[i],p2=raw[i+1];
        const d1=norm(p1.x-p0.x,p1.y-p0.y), d2=norm(p2.x-p1.x,p2.y-p1.y);
        if(d1[0]*d2[0]+d1[1]*d2[1]>0.99) continue;
      }
      wps.push(raw[i]);
    }
    this.route={wps,i:0,start:{x:p.x,y:p.y}};
    this.wrongTime=0; this.raw='ON_ROUTE'; this.state='ON_ROUTE';
  }
  nextWaypoint(){ return this.route?this.route.wps[this.route.i]:null; }
  remaining(){ return this.route?this.route.wps.slice(this.route.i):[]; }
  // classify every frame. pos {x,y}, vel [vx,vy] px/s
  update(pos,vel,dt,now){
    const ev={advanced:false,replanned:false,recovered:false,arrived:false};
    if(!this.route) return ev;
    if(hyp(pos.x-DOOR.x,pos.y-DOOR.y)<=ARRIVE_R){ if(this.state!=='ARRIVED') ev.arrived=true; this.state='ARRIVED'; this.raw='ARRIVED'; return ev; }
    const r=this.route;
    // monotonic waypoint commitment: only ever advance
    while(r.i<r.wps.length-1){
      const w=r.wps[r.i], n=r.wps[r.i+1];
      const pj=projSeg(pos.x,pos.y,w.x,w.y,n.x,n.y);
      if(hyp(pos.x-w.x,pos.y-w.y)<16 || (pj.t>0.03&&pj.d<20)){ r.i++; ev.advanced=true; } else break;
    }
    const wp=r.wps[r.i];
    this.dirTo=norm(wp.x-pos.x,wp.y-pos.y);
    // corridor = segment into current waypoint + segment out of it
    // the incoming segment extends backward along the same street (up to the drift limit): walking back
    // along the right street is WRONG_DIRECTION by velocity, not "off the corridor"
    const prev=r.i>0?r.wps[r.i-1]:r.start;
    const back=norm(prev.x-wp.x,prev.y-wp.y), L=hyp(prev.x-wp.x,prev.y-wp.y)+DRIFT_REPLAN;
    let dRoute=projSeg(pos.x,pos.y,wp.x,wp.y,wp.x+back[0]*L,wp.y+back[1]*L).d;
    if(r.i+1<r.wps.length){ const n=r.wps[r.i+1]; dRoute=Math.min(dRoute,projSeg(pos.x,pos.y,wp.x,wp.y,n.x,n.y).d); }
    const ne=this.nearestEdge(pos.x,pos.y); this.dGraph=ne.d; this.dRoute=dRoute;
    const speed=hyp(vel[0],vel[1]); const moving=speed>15;
    let raw;
    if(ne.d>this.streetHalfWidthAt(ne)+10) raw='OFF_ROUTE';                        // left the street graph
    else if(dRoute>28) raw='WRONG_DIRECTION';                                       // on a street, but not the committed one
    else if(moving && (vel[0]*this.dirTo[0]+vel[1]*this.dirTo[1])/speed<-0.35) raw='WRONG_DIRECTION'; // right street, walking away
    else raw='ON_ROUTE';
    if(raw==='ON_ROUTE'){ if(this.raw!=='ON_ROUTE'&&this.raw!=='RECOVERED'){ this.recoverT=now; ev.recovered=true; } this.wrongTime=0; }
    else this.wrongTime+=dt;
    let st=raw; if(raw==='ON_ROUTE' && now-this.recoverT<2.0) st='RECOVERED';
    this.raw=raw; this.state=st;
    // drifted too far: replan from here rather than dragging the walker back through a committed junction
    if(dRoute>DRIFT_REPLAN){ this.planFrom(pos); ev.replanned=true; }
    return ev;
  }
}

/* =====================================================================
   GUIDANCE LAYER — phrases only. Never computes routes.
   ===================================================================== */
const STYLE_ORDER=['cardinal','relative','landmark'];
const STYLE_INFO={
  cardinal:{zh:'方位',short:'北',en:'cardinal',curiosity:'信我，這次聽方位。',curEn:'Trust me, listen for north.'},
  relative:{zh:'左右',short:'左右',en:'relative',curiosity:'信我，這次用左右。',curEn:'Trust me, left and right this time.'},
  landmark:{zh:'地標',short:'地標',en:'landmark',curiosity:'信我，我們看地標。',curEn:'Trust me, we follow the landmarks.'},
};
const Guidance={
  cardinal(q){
    const [dx,dy]=q.dirTo; let zh,en;
    if(Math.abs(dx)>Math.abs(dy)){ zh=dx>0?'東':'西'; en=dx>0?'east':'west'; } else { zh=dy>0?'南':'北'; en=dy>0?'south':'north'; }
    return {style:'cardinal', zh:(q.cont?'繼續':'')+`往${zh}走`, en:(q.cont?'Keep heading ':'Head ')+en};
  },
  relative(q){
    const a=signedAngle(q.facing[0],q.facing[1],q.dirTo[0],q.dirTo[1]);
    if(Math.abs(a)<35) return {style:'relative', zh:q.cont?'繼續直直往前走':'直直往前走', en:q.cont?'Keep going straight':'Go straight ahead'};
    if(Math.abs(a)>145) return {style:'relative', zh:'轉身往回走', en:'Turn around and walk back'};
    return a>0?{style:'relative', zh:'往你的右手邊', en:'To your right'}:{style:'relative', zh:'往你的左手邊', en:'To your left'};
  },
  landmark(q){
    let best=null;
    for(const R of [200,420]){ // near-and-ahead first; if nothing is near, the nearest glowing thing farther ahead
      for(const lm of LANDMARKS){
        if(!lm.guide) continue;
        const vx=lm.x-q.pos.x, vy=lm.y-q.pos.y, d=hyp(vx,vy); if(d<22||d>R) continue;
        const ahead=(vx*q.dirTo[0]+vy*q.dirTo[1])/d; if(ahead<0.35) continue;
        if(!best||d<best.d) best={lm,d,vx,vy};
      }
      if(best) break;
    }
    if(!best){ const r=Guidance.relative(q); r.fallback=true; return r; }  // recorded under relative, never landmark
    const a=signedAngle(q.facing[0],q.facing[1],best.vx,best.vy); const abs=Math.abs(a), side=a>0?'右':'左', sideEn=a>0?'right':'left';
    let sec,secEn;
    if(abs<20){sec='正前方';secEn='straight ahead';}
    else if(abs<80){sec=side+'前方';secEn=`ahead on your ${sideEn}`;}
    else if(abs<115){sec=side+'手邊';secEn=`on your ${sideEn}`;}
    else {sec=side+'後方';secEn=`behind you on the ${sideEn}`;}
    return {style:'landmark', zh:`${best.lm.name}在你的${sec}，跟著燈光走`, en:`${best.lm.en} is ${secEn} — follow the lights`, landmark:best.lm};
  },
  phrase(style,q){ return Guidance[style](q); }
};

/* =====================================================================
   USER MODEL — per-style trials, 3-strike AVOIDED, sticky preference,
   deterministic curiosity every 5th instruction
   ===================================================================== */
class UserModel{
  constructor(){
    this.m={}; for(const s of STYLE_ORDER) this.m[s]={trials:0,success:0,streak:0,avoided:false,evidence:''};
    this.preferred='cardinal'; this.count=0;
  }
  rate(s){const m=this.m[s];return m.trials?m.success/m.trials:0;}
  score(s){const m=this.m[s];return (m.success+1)/(m.trials+2);}
  live(){return STYLE_ORDER.filter(s=>!this.m[s].avoided);}
  best(){ let L=this.live();
    if(!L.length){ // every style struck out: give the best-scoring one a fresh chance
      const b=STYLE_ORDER.slice().sort((a,c)=>this.score(c)-this.score(a))[0]; this.m[b].avoided=false; this.m[b].streak=0; this.m[b].evidence='再給一次機會'; L=[b]; }
    let b=L[0]; for(const s of L) if(this.score(s)>this.score(b)+1e-9) b=s; return b; }
  choose(){ // returns {style, curiosity}
    this.count++;
    if(this.live().length===0){ // total dead end: give the best-scoring style one more chance
      const b=STYLE_ORDER.slice().sort((a,c)=>this.score(c)-this.score(a))[0];
      this.m[b].avoided=false; this.m[b].streak=0; this.preferred=b;
      return {style:b,curiosity:false,reprieve:true};
    }
    if(this.m[this.preferred].avoided) this.preferred=this.best();
    if(this.count%5===0){
      // least-used live style; on a tie prefer one that is NOT the current preference, so curiosity actually shows something new
      const L=this.live().slice().sort((a,b)=>(this.m[a].trials-this.m[b].trials)||((a===this.preferred)-(b===this.preferred))||(STYLE_ORDER.indexOf(a)-STYLE_ORDER.indexOf(b)));
      const least=L[0];
      return {style:least,curiosity:true};
    }
    return {style:this.preferred,curiosity:false};
  }
  record(style,ok){
    const m=this.m[style]; m.trials++;
    if(ok){ m.success++; m.streak=0; return {switched:false}; }
    m.streak++;
    if(m.streak>=3&&!m.avoided){
      m.avoided=true; m.evidence=`${STYLE_INFO[style].short} ×3 連續失敗 → AVOIDED`;
      const was=this.preferred; if(this.preferred===style||this.m[this.preferred].avoided) this.preferred=this.best();
      return {switched:true,from:style,to:this.preferred,wasPreferred:was===style};
    }
    return {switched:false};
  }
}

const STREET_LABEL_RECTS=[[130,10,20,50],[370,10,20,50],[670,10,20,50],[6,102,60,16],[6,292,120,16],[6,492,150,16],[6,580,200,16],[518,MRT_Y-10,84,20]];

/* label layout — keeps labels off each other, the route line and moving characters */
const LabelLayout={
  measured:false, cache:new Map(), frame:0,
  measure(){
    ctx.font='600 13px "Noto Sans TC","PingFang TC",sans-serif';
    for(const lm of LANDMARKS){ const zw=ctx.measureText(lm.name).width; ctx.font='10px system-ui,sans-serif'; const ew=ctx.measureText(lm.en).width; ctx.font='600 13px "Noto Sans TC","PingFang TC",sans-serif';
      lm._w=Math.max(zw,ew)+6; lm._h=28; }
    this.measured=true;
  },
  rectFor(lm,cand){
    const w=lm._w,h=lm._h,x=lm.x,y=lm.y, o=lm.type==='musha'?20:14;
    switch(cand){
      case 'r': return [x+o,y-h/2,w,h];
      case 'l': return [x-o-w,y-h/2,w,h];
      case 'a': return [x-w/2,y-o-h+2,w,h];
      case 'b': return [x-w/2,y+o-2,w,h];
      case 'in': return [x-w/2,y-h/2,w,h];
      case 'c': return [x-w/2,y-h/2,w,h];
    }
  },
  hit(r,q){ return r[0]<q[0]+q[2]&&r[0]+r[2]>q[0]&&r[1]<q[1]+q[3]&&r[1]+r[3]>q[1]; },
  segHit(r,ax,ay,bx,by){ const n=Math.ceil(hyp(bx-ax,by-ay)/5)||1; for(let i=0;i<=n;i++){ const x=ax+(bx-ax)*i/n,y=ay+(by-ay)*i/n; if(x>r[0]-3&&x<r[0]+r[2]+3&&y>r[1]-3&&y<r[1]+r[3]+3) return true; } return false; },
  layout(routePts,boxes){
    if(!this.measured) this.measure();
    const placed=[...STREET_LABEL_RECTS];
    const icons=LANDMARKS.filter(l=>l.type!=='hnbklabel'&&l.type!=='nanshan').map(l=>[l.x-11,l.y-11,22,22]);
    const order=LANDMARKS.slice().sort((a,b)=>(a.type==='hnbklabel'?-1:0)-(b.type==='hnbklabel'?-1:0));
    for(const lm of order){
      let best=null,bestPen=1e9;
      for(const cand of lm.cands){
        const r=this.rectFor(lm,cand); let pen=0;
        for(const q of placed) if(this.hit(r,q)) pen+=10;
        for(const q of icons) if(this.hit(r,q)&&!(Math.abs(q[0]+11-lm.x)<1&&Math.abs(q[1]+11-lm.y)<1)) pen+=4;
        for(const q of boxes) if(this.hit(r,q)) pen+=6;
        for(let i=0;i<routePts.length-1;i++) if(this.segHit(r,routePts[i].x,routePts[i].y,routePts[i+1].x,routePts[i+1].y)){ pen+=5; break; }
        if(r[0]<2||r[1]<2||r[0]+r[2]>W-2||r[1]+r[3]>H-2) pen+=3;
        if(pen<bestPen){bestPen=pen;best={cand,r};}
        if(pen===0) break;
      }
      placed.push(best.r); this.cache.set(lm.id,best);
    }
  },
  draw(c,highlightId){
    for(const lm of LANDMARKS){
      const p=this.cache.get(lm.id); if(!p) continue; const [x,y,w,h]=p.r;
      const hi=lm.id===highlightId;
      c.fillStyle=hi?'rgba(30,26,10,.85)':'rgba(8,11,20,.72)'; rrect(c,x,y,w,h,5); c.fill();
      if(hi){ c.strokeStyle='rgba(255,210,122,.9)'; c.lineWidth=1; c.stroke(); }
      c.textAlign='left'; c.textBaseline='alphabetic';
      c.font=(lm.type==='hnbklabel'?'700 13px':'600 13px')+' "Noto Sans TC","PingFang TC",sans-serif';
      c.fillStyle=hi?'#ffe4a8':(lm.type==='hnbklabel'?'#ffd27a':'#e8e4d8'); c.fillText(lm.name,x+3,y+13);
      c.font='10px system-ui,sans-serif'; c.fillStyle='rgba(180,190,210,.85)'; c.fillText(lm.en,x+3,y+24);
    }
  }
};

function drawOwl(c,o){
  c.save(); c.translate(o.x,o.y);
  c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(5,16,11,5,0,0,Math.PI*2); c.fill();
  c.rotate(o.ang+Math.PI/2);
  const f=Math.sin(o.flap); const sw=o.hard?1.0:0.6;
  // wings
  for(const s of [-1,1]){ c.save(); c.translate(s*8,3); c.rotate(s*(0.25+sw*0.5*f)); c.fillStyle='#5b3a1e'; c.beginPath(); c.ellipse(s*(9+3*f),0,12+3*Math.abs(f),5.2,0,0,Math.PI*2); c.fill();
    c.strokeStyle='rgba(255,220,180,.25)'; c.lineWidth=1; c.beginPath(); c.moveTo(s*4,1); c.lineTo(s*(17+3*f),1); c.stroke(); c.restore(); }
  // body
  c.fillStyle='#7a4a26'; c.beginPath(); c.ellipse(0,5,11,12,0,0,Math.PI*2); c.fill();
  c.fillStyle='#c79b63'; c.beginPath(); c.ellipse(0,7,6.5,8,0,0,Math.PI*2); c.fill();
  c.fillStyle='#8a5a30'; for(let i=0;i<5;i++){ c.beginPath(); c.arc(-3+ (i%3)*3, 3+Math.floor(i/3)*4+ (i%2), 0.9,0,Math.PI*2); c.fill(); }
  // head
  c.fillStyle='#8b5630'; c.beginPath(); c.arc(0,-6,9.6,0,Math.PI*2); c.fill();
  // ear tufts
  c.fillStyle='#6a3f1f'; c.beginPath(); c.moveTo(-6,-12); c.lineTo(-11,-21); c.lineTo(-2,-14.5); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(6,-12); c.lineTo(11,-21); c.lineTo(2,-14.5); c.closePath(); c.fill();
  // facial discs + amber eyes
  c.fillStyle='#d9b382'; c.beginPath(); c.arc(-4.2,-6.5,4.8,0,Math.PI*2); c.arc(4.2,-6.5,4.8,0,Math.PI*2); c.fill();
  const blink=((o.t||0)%3.7)>3.55; // a quick blink every ~3.7s
  if(blink){ c.strokeStyle='#5a3418'; c.lineWidth=1.6; c.beginPath(); c.moveTo(-7.5,-6.5); c.lineTo(-1,-6.5); c.moveTo(1,-6.5); c.lineTo(7.5,-6.5); c.stroke(); }
  else{
    c.fillStyle='#f6b331'; c.beginPath(); c.arc(-4.2,-6.5,3.7,0,Math.PI*2); c.fill(); c.beginPath(); c.arc(4.2,-6.5,3.7,0,Math.PI*2); c.fill();
    c.fillStyle='#1a0f08'; c.beginPath(); c.arc(-4.2,-6.8,1.8,0,Math.PI*2); c.fill(); c.beginPath(); c.arc(4.2,-6.8,1.8,0,Math.PI*2); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.arc(-3.4,-7.6,0.7,0,Math.PI*2); c.fill(); c.beginPath(); c.arc(5,-7.6,0.7,0,Math.PI*2); c.fill();
  }
  // beak
  c.fillStyle='#e07b2a'; c.beginPath(); c.moveTo(0,-1.2); c.lineTo(-1.8,-4.2); c.lineTo(1.8,-4.2); c.closePath(); c.fill();
  c.restore();
}
function drawPlayer(c,p){

const engine=new NavEngine();

const G={

function schedule(delay,fn){ G.pending.push({t:G.t+delay,fn}); }
function clearPending(){ G.pending.length=0; }
function addLog(text,kind){ G.log.unshift({t:G.t,text,kind}); if(G.log.length>40) G.log.length=40; G.uiDirty=true; }

/* ---- trips ---- */
function startTrip(exitIdx){
  const e=EXITS[exitIdx];
  const p=G.player; p.x=e.x; p.y=500; p.fx=0; p.fy=-1; p.vx=p.vy=0;
  G.owl.x=e.x; G.owl.y=478; G.owl.ang=-Math.PI/2;
  G.trail.length=0; G.trial=null; G.instr=null; clearPending(); G.correctionUntil=-1; G.lastCorrection=-99;
  G.walker={mode:'idle',dir:[0,0],style:null};
  engine.planFrom(p);
  G.trip={n:G.trips.length+1,exit:e.n,t0:G.t,wrong:0,done:false,replans:0};
  Voice.stop();
  setBanner('跟我走，我知道路。','Follow me, I know the way.','');
  Voice.say('跟我走，我知道路。','Follow me, I know the way.',true);
  addLog(`旅程 #${G.trip.n} 從象山站出口${e.n}出發，偏好風格：${STYLE_INFO[model.preferred].zh}`,'');
  schedule(1.4,()=>prepareInstruction({}));

}
function finishTrip(){
  const tr=G.trip; if(!tr||tr.done) return;
  tr.done=true; tr.time=G.t-tr.t0; tr.pref=model.preferred;
  G.trips.push(tr); if(G.trial){G.trial=null;} clearPending();
  setBanner('到了。收工！','We\'re here. That\'s a wrap!','arrived');
  Voice.say('到了。收工！',"We're here. That's a wrap!",true); Sfx.chime();

  const zh=`飛寶學到了：你靠「${L.zh}」認路${avoided.length?`，${avoided.join('、')}對你沒用`:''}。`;

  const en=`Fable learned: you navigate by ${EN[learned]}${avEn.length?`. ${avEn.join(' and ')} didn't work for you`:''}.`;

/* ---- instructions & trials ---- */
function query(cont){
  const p=G.player; return {pos:{x:p.x,y:p.y},facing:[p.fx,p.fy],dirTo:engine.dirTo,cont:!!cont};
}
function prepareInstruction({cont=false,correction=false}={}){
  if(!G.trip||G.trip.done||engine.state==='ARRIVED') return;
  const pick=model.choose();
  if(pick.reprieve) addLog(`三種都不行，再給「${STYLE_INFO[pick.style].zh}」一次機會`,'switch');
  if(pick.curiosity){
    const info=STYLE_INFO[pick.style];
    addLog(`試試${info.zh}…（好奇心 curiosity）`,'cur');
    const zh=(correction?'走錯囉，沒關係！':'')+info.curiosity;
    const enC=(correction?'Wrong way — no worries! ':'')+info.curEn; setBanner(zh,enC,correction?'correct':'');
    Voice.say(zh,enC,correction); if(correction) G.correctionUntil=G.t+2.2;
    schedule(1.4,()=>deliver(pick.style,{cont,curiosity:true,correction}));
  } else deliver(pick.style,{cont,correction});
}
function deliver(style,{cont=false,correction=false,curiosity=false}={}){
  if(!G.trip||G.trip.done||engine.state==='ARRIVED') return;
  const q=query(cont); const ph=Guidance.phrase(style,q);
  if(ph.fallback) addLog('附近沒有可用地標，改用左右（記在左右，不記地標）','');
  const zh=(correction?'走錯囉，沒關係！':'')+ph.zh, en=(correction?'Wrong way — no worries! ':'')+ph.en;
  setBanner(zh,en,correction?'correct':'');
  Voice.say(zh,en,correction);
  G.instr={style:ph.style,requested:style,zh,en,t:G.t,landmark:ph.landmark||null,curiosity,correction}; G.instrSeq++;
  // a human who has not touched the controls yet is not evidence: the 3.5s clock arms on first movement. The auto-walker is measured strictly.
  G.trial={style:ph.style,delivered:ph.style,t0:G.t,x0:q.pos.x,y0:q.pos.y,dir:[...q.dirTo],wp:engine.route.i,landmark:ph.landmark||null,armed:G.auto};
  if(correction) G.correctionUntil=G.t+2.2;
  engine.wrongTime=0; // a fresh instruction gets a fresh ~1s grace before any wrong-way interrupt
  // lost tourist decides how to react to this style
  if(G.auto) walkerReact(ph.style);
  G.uiDirty=true;
}
function resolveTrial(ok,why){
  const tr=G.trial; if(!tr) return {switched:false}; G.trial=null;
  const res=model.record(tr.style,ok);
  if(!ok) addLog(`${STYLE_INFO[tr.style].zh}指令失敗（${why}）— 連續 ${model.m[tr.style].streak} 次`,'fail');
  if(res.switched){
    addLog(`${STYLE_INFO[res.from].short} ×3 失敗 → 改用${STYLE_INFO[res.to].short}`,'switch');
    Sfx.hoot();
  }
  G.uiDirty=true; return res;
}
function afterFail(res,{correction=false}={}){
  if(res.switched){
    const zh=(correction?'走錯囉，沒關係！':'')+'好吧，我換種方式。';
    const en=(correction?'Wrong way — no worries! ':'')+'Alright, let me try another way.'; setBanner(zh,en,correction?'correct':'');
    Voice.say(zh,en,true); if(correction) G.correctionUntil=G.t+2.2;
    schedule(1.4,()=>prepareInstruction({correction:false}));
  } else prepareInstruction({correction});
}
function doCorrection(){
  if(!G.trip||G.trip.done) return;
  G.lastCorrection=G.t; G.trip.wrong++; engine.wrongTime=-2.0; // re-arm ~3s later if still wrong
  clearPending();
  const res=G.trial?resolveTrial(false,'走錯方向'):{switched:false};
  afterFail(res,{correction:true});
}

/* ---- lost tourist (auto-walker) ---- */
function walkable(x,y){ return engine.onStreet(x,y,3) && x>4&&x<W-4&&y>4&&y<H-4; }
function walkerReact(style){
  const w=G.walker; w.style=style;
  const follows=G.persona?G.persona.follows:['relative','landmark'];
  if(!follows.includes(style)){ // this tourist does not understand this kind of instruction: takes a wrong turn instead
    const [dx,dy]=engine.dirTo; const p=G.player;
    const cands=[[-dx,-dy],[-dy,dx],[dy,-dx]]; const rot=model.count%3; const ordered=cands.slice(rot).concat(cands.slice(0,rot));
    w.mode='idle'; for(const d of ordered){ if(walkable(p.x+d[0]*26,p.y+d[1]*26)){ w.dir=d; w.mode='wander'; break; } }
  } else w.mode='follow';
}
function walkerVelocity(dt){
  const w=G.walker, p=G.player;
  if(w.mode==='follow'){ const wp=engine.nextWaypoint(); if(!wp) return [0,0]; const dx=wp.x-p.x, dy=wp.y-p.y; const sx=Math.sign(dx), sy=Math.sign(dy);
    let d; if(Math.abs(dx)<2) d=[0,sy]; else if(Math.abs(dy)<2) d=[sx,0]; else d=walkable(p.x+sx*10,p.y)?[sx,0]:[0,sy];
    return [d[0]*130,d[1]*130]; }
  if(w.mode==='wander'){ if(!walkable(p.x+w.dir[0]*14,p.y+w.dir[1]*14)){ w.mode='idle'; return [0,0]; } return [w.dir[0]*75,w.dir[1]*75]; }
  return [0,0];
}

/* ---- particles ---- */
function burst(){
  const cols=['#ffd54a','#ffc107','#ffe58a','#f5b32b','#fff3c4','#e6a817'];
  for(let i=0;i<170;i++){
    const a=-Math.PI/2+(Math.random()-0.5)*2.4, sp=160+Math.random()*300;
    G.particles.push({x:DOOR.x,y:DOOR.y,vx:Math.cos(a)*sp-40,vy:Math.sin(a)*sp,rot:Math.random()*6.28,vr:(Math.random()-0.5)*14,w:4+Math.random()*5,h:2+Math.random()*4,color:cols[i%cols.length],life:3.2+Math.random()*0.8,age:0,kind:'confetti'});
  }
}
function updateParticles(dt){
  if(G.t<G.powderUntil) for(let i=0;i<7;i++) G.particles.push({x:Math.random()*W,y:-4,vx:(Math.random()-0.5)*30,vy:70+Math.random()*90,rot:0,vr:0,w:1+Math.random()*1.8,h:0,color:'#ffd98a',life:9,age:0,kind:'powder'});
  for(const p of G.particles){
    p.age+=dt; p.vy+= (p.kind==='confetti'?520:40)*dt; p.vx*= (1-1.2*dt); p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
  }
  G.particles=G.particles.filter(p=>p.age<p.life&&p.y<H+10);
}
function drawParticles(c){
  for(const p of G.particles){
    const a=p.kind==='confetti'?clamp((p.life-p.age)/1.0,0,1):clamp(1-(p.y/H),0.05,0.9);
    c.globalAlpha=a;
    if(p.kind==='confetti'){ c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.color; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore(); }
    else { c.fillStyle=p.color; c.beginPath(); c.arc(p.x,p.y,p.w,0,Math.PI*2); c.fill(); }
  }
  c.globalAlpha=1;
}

/* ---- input ---- */
window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){ G.keys.add(k); e.preventDefault(); Sfx.ensure(); } });
window.addEventListener('keyup',e=>G.keys.delete(e.key.toLowerCase()));
function toMap(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}; }
canvas.addEventListener('pointerdown',e=>{ G.pointer.down=true; Object.assign(G.pointer,toMap(e)); canvas.setPointerCapture(e.pointerId); Sfx.ensure(); });
canvas.addEventListener('pointermove',e=>{ if(G.pointer.down) Object.assign(G.pointer,toMap(e)); });
const endPtr=e=>{G.pointer.down=false;}; canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
function humanVelocity(){
  let dx=0,dy=0; const K=G.keys;
  if(K.has('arrowup')||K.has('w')) dy-=1; if(K.has('arrowdown')||K.has('s')) dy+=1; if(K.has('arrowleft')||K.has('a')) dx-=1; if(K.has('arrowright')||K.has('d')) dx+=1;
  if(dx||dy){ const [nx,ny]=norm(dx,dy); return [nx*140,ny*140]; }
  if(G.pointer.down){ const vx=G.pointer.x-G.player.x, vy=G.pointer.y-G.player.y; const d=hyp(vx,vy); if(d>5){ const s=Math.min(140,d*6); return [vx/d*s,vy/d*s]; } }
  return [0,0];
}

window.addEventListener('pointerdown',()=>Sfx.ensure(),{once:true});
/* ---- UI buttons ---- */
const btnTrip=document.getElementById('btnTrip'), btnMute=document.getElementById('btnMute'), exitSel=document.getElementById('exitSel'), btn3d=document.getElementById('btn3d');
const PERSONAS={
  1:{id:1,name:'路痴旅客 1｜只懂左右',en:'tourist 1 · understands left/right only',follows:['relative']},
  2:{id:2,name:'路痴旅客 2｜只認路標',en:'tourist 2 · follows landmarks only',follows:['landmark']},
};
function syncPersonaButtons(){ document.querySelectorAll('button.persona').forEach(b=>{ const on=G.auto&&G.persona&&G.persona.id===+b.dataset.p; b.classList.toggle('on',on); b.textContent=(on?'■ 停止 ':'')+PERSONAS[b.dataset.p].name; });
  document.getElementById('personaTag').textContent=G.persona?PERSONAS[G.persona.id].en+' — 獨立記憶':'how you understand directions'; }
function resetMemory(){ model=new UserModel(); G.trips=[]; G.log=[]; G.uiDirty=true; }
document.querySelectorAll('button.persona').forEach(b=>b.onclick=()=>{ Sfx.ensure(); const P=PERSONAS[b.dataset.p];
  if(G.auto&&G.persona&&G.persona.id===P.id){ G.auto=false; G.walker.mode='idle'; syncPersonaButtons(); return; }
  if(!G.persona||G.persona.id!==P.id){ G.persona=P; resetMemory(); addLog(`切換為「${P.name}」— 記憶重新開始（兩位旅客的記憶不重疊）`,'switch'); }
  G.auto=true; startTrip(pickExit()); syncPersonaButtons(); });
document.getElementById('btnLang').onclick=function(){ Voice.lang=Voice.lang==='en'?'zh':'en'; Voice.stop(); this.textContent=Voice.lang==='en'?'🗣 EN':'🗣 中文'; };
document.getElementById('btnReset').onclick=()=>{ G.auto=false; G.persona=null; G.walker.mode='idle'; resetMemory(); syncPersonaButtons(); addLog('記憶已清空 — 飛寶從零開始','switch'); startTrip(pickExit()); };
window.addEventListener('keydown',e=>{ if(e.repeat||e.metaKey||e.ctrlKey) return; const k=e.key.toLowerCase(); if(k==='1') document.getElementById('btnP1').click(); else if(k==='2') document.getElementById('btnP2').click(); else if(k==='n') btnTrip.click(); else if(k==='r') document.getElementById('btnReset').click(); else if(k==='m') btnMute.click(); });
btn3d.onclick=()=>{ document.body.classList.toggle('tilt'); btn3d.classList.toggle('on',document.body.classList.contains('tilt')); };
document.body.classList.add('tilt');
function pickExit(){ const v=+exitSel.value; return v>=0?v:Math.floor(Math.random()*3); }
btnTrip.onclick=()=>{ Sfx.ensure(); startTrip(pickExit()); };

document.getElementById('btnBgm').onclick=function(){ const on=BGM.toggle(); this.textContent=on?'♫ BGM':'♫ BGM 關'; this.classList.toggle('on',on); };
btnMute.onclick=()=>{ const m=!Voice.muted; Voice.muted=m; Sfx.muted=m; if(m) Voice.stop(); btnMute.textContent=m?'🔇':'🔊'; btnMute.classList.toggle('on',m); };

/* ---- side panel ---- */
const stylesEl=document.getElementById('styles'), logEl=document.getElementById('log'), tripsBody=document.querySelector('#trips tbody');
function renderPanel(){
  let h='';
  for(const s of STYLE_ORDER){
    const m=model.m[s], info=STYLE_INFO[s]; const rate=m.trials?Math.round(100*m.success/m.trials):0;
    const tags=(model.preferred===s&&!m.avoided?'<span class="tag pref">偏好 PREFERRED</span>':'')+(m.avoided?'<span class="tag avoid">AVOIDED</span>':'')+(G.trial&&G.trial.style===s?'<span class="tag cur">測試中</span>':'');
    h+=`<div class="style"><div class="row"><span><b>${info.zh}</b> <span style="color:var(--dim);font-size:11px">${info.en}</span>${tags}</span><span>${m.success}/${m.trials} 次 · ${m.trials?rate+'%':'—'}</span></div>
      <div class="bar${m.avoided?' avoid':''}"><i style="width:${m.trials?rate:0}%"></i></div><div class="ev">${m.evidence||(m.streak?`連續失敗 ${m.streak}/3`:'')}</div></div>`;
  }
  stylesEl.innerHTML=h;
  logEl.innerHTML=G.log.slice(0,14).map(l=>`<li class="${l.kind}"><time>${fmtT(l.t)}</time>${l.text}</li>`).join('');
  const first=G.trips[0];
  tripsBody.innerHTML=G.trips.map((t,i)=>{ const better=i>0&&first&&t.time<first.time; return `<tr class="${better?'better':''}"><td>${t.n}</td><td>出口${t.exit}</td><td class="num">${t.time.toFixed(1)}s</td><td class="num">${t.wrong}</td><td>${STYLE_INFO[t.pref].zh}${better?' ✓ 更快':''}</td></tr>`; }).join('')
    +(G.trip&&!G.trip.done?`<tr><td>${G.trip.n}</td><td>出口${G.trip.exit}</td><td class="num">${(G.t-G.trip.t0).toFixed(0)}s…</td><td class="num">${G.trip.wrong}</td><td style="color:var(--dim)">進行中</td></tr>`:'');
  G.uiDirty=false;
}

/* ---- main loop ---- */
let frame=0, uiTick=0;
function step(now){
  requestAnimationFrame(step);
  let dt=(now-G.last)/1000; G.last=now; dt=clamp(dt,0,0.05); G.t+=dt; frame++;
  const p=G.player;
  // pending timed events
  for(let i=0;i<G.pending.length;i++) if(G.pending[i].t<=G.t){ const ev=G.pending.splice(i,1)[0]; i--; ev.fn(); }
  // movement
  let v=[0,0]; const active=G.trip&&!G.trip.done;
  if(active){ v=G.auto?walkerVelocity(dt):humanVelocity(); }
  const ox=p.x, oy=p.y;
  { // streets only — no cutting through a block. Try the full step, then slide along one axis, else stay.
    const canStand=(x,y)=>engine.onStreet(x,y,3);
    const nx=clamp(p.x+v[0]*dt,4,W-4), ny=clamp(p.y+v[1]*dt,4,H-4);
    if(canStand(nx,ny)){ p.x=nx; p.y=ny; } else if(canStand(nx,oy)){ p.x=nx; } else if(canStand(ox,ny)){ p.y=ny; }
  }
  for(const B of SOLID){ // buildings are solid — the entrance must be reached from Songren Rd
    const inside=(x,y)=>x>B.x-6&&x<B.x+B.w+6&&y>B.y-6&&y<B.y+B.h+6;
    if(inside(p.x,p.y)){ if(!inside(ox,p.y)) p.x=ox; else if(!inside(p.x,oy)) p.y=oy; else { p.x=ox; p.y=oy; } }
  }
  const ivx=(p.x-ox)/Math.max(dt,1e-3), ivy=(p.y-oy)/Math.max(dt,1e-3);
  p.vx+= (ivx-p.vx)*Math.min(1,dt*12); p.vy+=(ivy-p.vy)*Math.min(1,dt*12);
  const sp=hyp(p.vx,p.vy); if(sp>12){ const [fx,fy]=norm(p.vx,p.vy); p.fx=fx; p.fy=fy; }
  if(hyp(p.x-ox,p.y-oy)>1.5){ G.trail.push({x:p.x,y:p.y,t:G.t}); }
  while(G.trail.length&&G.t-G.trail[0].t>14) G.trail.shift();

  // navigation truth
  if(active){
    const ev=engine.update(p,[p.vx,p.vy],dt,G.t);
    if(ev.arrived){ finishTrip(); }
    else{
      if(ev.replanned){ G.trip.replans++; addLog('偏離超過 250px，從目前位置重新規劃（不回頭走已通過的路口）',''); clearPending(); G.trial=null; if(G.auto) G.walker.mode='idle'; prepareInstruction({}); }
      if(ev.recovered && G.t-G.lastRecoveryLine>6){ G.lastRecoveryLine=G.t; Voice.say('回來就好，不丟臉。',"Good, you're back. No shame in that.",false); addLog('回到路上 — 「回來就好，不丟臉。」',''); }
      // trial measurement
      const tr=G.trial;
      if(tr){
        if(!tr.armed && (sp>12||G.auto)){ tr.armed=true; tr.t0=G.t; }
        const prog=(p.x-tr.x0)*tr.dir[0]+(p.y-tr.y0)*tr.dir[1];
        const dwp=hyp(engine.nextWaypoint().x-p.x,engine.nextWaypoint().y-p.y);
        if(ev.advanced||prog>=26){
          resolveTrial(true,'');
          if(ev.advanced) prepareInstruction({});                       // new decision point → new instruction
          else if(dwp>70){ const seq=G.instrSeq; schedule(2.5,()=>{ if(G.instrSeq===seq&&!G.trial) prepareInstruction({cont:true}); }); } // long straight: next trial after a breath
        } else if(tr.armed && G.t-tr.t0>3.5){
          const res=resolveTrial(false,'3.5 秒內沒有往正確方向移動'); afterFail(res,{});
        }
      } else if(ev.advanced && !G.pending.length){ prepareInstruction({}); }
      // ~1s wrong-way interrupt
      if(engine.wrongTime>=1.0 && G.t-G.lastCorrection>2.5) doCorrection();
    }
  }
  // owl
  const o=G.owl; const wp=engine.nextWaypoint(); const d=engine.dirTo;
  let tx,ty; const correcting=G.t<G.correctionUntil;
  if(engine.state==='ARRIVED'||!active){ tx=DOOR.x+22+Math.sin(G.t*1.3)*6; ty=DOOR.y-30+Math.cos(G.t*1.7)*4; if(!active&&!G.trips.length){tx=p.x+30;ty=p.y-28;} }
  else if(correcting){ const k=(Math.sin(G.t*7)+1)/2; tx=p.x+d[0]*(18+56*k); ty=p.y+d[1]*(18+56*k)-6; }
  else { tx=p.x+d[0]*48+Math.sin(G.t*2.1)*5; ty=p.y+d[1]*48-10+Math.cos(G.t*1.6)*5; }
  const lerp=Math.min(1,dt*(correcting?9:5)); o.x+=(tx-o.x)*lerp; o.y+=(ty-o.y)*lerp;
  const want=active&&engine.state!=='ARRIVED'?Math.atan2(d[1],d[0]):Math.atan2(p.y-o.y,p.x-o.x); let da=want-o.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI; o.ang+=da*Math.min(1,dt*6);
  o.hard=correcting; o.t=G.t; o.flap+=dt*(correcting?22:(sp>20?11:6));
  updateParticles(dt);

  /* ---- draw ---- */
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H); ctx.drawImage(bg,0,0,W,H);
  // breathing lobby & door glow
  const br=0.5+0.5*Math.sin(G.t*1.4); glow(ctx,LM.lobby.x,LM.lobby.y,60,'rgba(255,200,90,A)',0.12+0.14*br); glow(ctx,DOOR.x,DOOR.y,28,'rgba(255,225,140,A)',0.25+0.25*br);
  // arrival radius hint (subtle)
  ctx.strokeStyle='rgba(255,220,130,.28)'; ctx.setLineDash([2,4]); ctx.lineWidth=1; ctx.beginPath(); ctx.arc(DOOR.x,DOOR.y,ARRIVE_R,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  // trail
  if(G.trail.length>1){ ctx.lineWidth=1.6; ctx.lineCap='round'; for(let i=1;i<G.trail.length;i++){ const a=G.trail[i]; const age=G.t-a.t; ctx.strokeStyle=`rgba(190,235,255,${clamp(0.55*(1-age/14),0,0.55)})`; ctx.beginPath(); ctx.moveTo(G.trail[i-1].x,G.trail[i-1].y); ctx.lineTo(a.x,a.y); ctx.stroke(); } }
  // route line (remaining committed route)
  let routePts=[];
  if(active&&engine.route){
    routePts=[{x:p.x,y:p.y},...engine.remaining()];
    ctx.save(); ctx.shadowColor='rgba(94,224,255,.7)'; ctx.shadowBlur=10; ctx.strokeStyle='rgba(94,224,255,.55)'; ctx.lineWidth=2; ctx.setLineDash([6,8]); ctx.lineDashOffset=-G.t*40;
    ctx.beginPath(); ctx.moveTo(routePts[0].x,routePts[0].y); for(const q of routePts.slice(1)) ctx.lineTo(q.x,q.y); ctx.stroke(); ctx.restore();
    // waypoint markers
    for(const q of engine.remaining()){ ctx.fillStyle='rgba(94,224,255,.7)'; ctx.beginPath(); ctx.arc(q.x,q.y,3,0,Math.PI*2); ctx.fill(); }
    // next waypoint ring
    if(wp){ ctx.strokeStyle='rgba(94,224,255,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(wp.x,wp.y,8+2*Math.sin(G.t*4),0,Math.PI*2); ctx.stroke(); }
  }
  // referenced landmark pulse ring
  const hl=G.trial&&G.trial.landmark?G.trial.landmark:null;
  if(hl){ for(let k=0;k<3;k++){ const ph=((G.t*0.9+k/3)%1); ctx.strokeStyle=`rgba(255,210,122,${(1-ph)*0.8})`; ctx.lineWidth=2.5-ph*1.5; ctx.beginPath(); ctx.arc(hl.x,hl.y,12+ph*34,0,Math.PI*2); ctx.stroke(); } glow(ctx,hl.x,hl.y,50,'rgba(255,210,122,A)',0.25); }
  // correction beam from the owl toward the right way
  if(correcting&&active){ ctx.save(); ctx.strokeStyle='rgba(255,200,90,.9)'; ctx.lineWidth=2.5; ctx.setLineDash([4,7]); ctx.lineDashOffset=-G.t*90; ctx.shadowColor='rgba(255,200,90,.8)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x+d[0]*130,o.y+d[1]*130); ctx.stroke(); ctx.restore();
    // arrowhead
    const ax=o.x+d[0]*130, ay=o.y+d[1]*130; ctx.fillStyle='rgba(255,200,90,.95)'; ctx.beginPath(); ctx.moveTo(ax+d[0]*10,ay+d[1]*10); ctx.lineTo(ax-d[1]*6,ay+d[0]*6); ctx.lineTo(ax+d[1]*6,ay-d[0]*6); ctx.closePath(); ctx.fill(); }
  // characters
  drawPlayer(ctx,p);
  drawOwl(ctx,o);
  // labels (re-layout every 6 frames against route + characters)
  if(frame%6===0||!LabelLayout.cache.size){ LabelLayout.layout(routePts,[[p.x-12,p.y-12,24,24],[o.x-24,o.y-26,48,48]]); }
  LabelLayout.draw(ctx,hl?hl.id:null);
  drawParticles(ctx);

  // badge + panel
  const st=active?engine.state:(G.trip&&G.trip.done?'ARRIVED':'ON_ROUTE');
  if(badge.className!==st){ badge.className=st; badge.textContent=BADGE[st]; }
  if(G.t>=G.correctionUntil&&banner.classList.contains('correct')) banner.className='';
  if(G.uiDirty||(++uiTick%30===0)) renderPanel();
}
buildStatic();
startTrip(0);
requestAnimationFrame(step);
</script>
</body>
